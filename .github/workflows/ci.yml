name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-and-tests:
    name: Go Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Go environment
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
          cache-dependency-path: go.sum

      - name: Install Linux audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Verify Go modules
        run: |
          go mod verify

      - name: Run Go vet
        run: |
          if find . -name '*.go' -not -path './vendor/*' | grep -q .; then
            go vet ./...
          else
            echo "No Go files to vet yet."
          fi

      - name: Run Go unit tests
        run: |
          if find . -name '*_test.go' -not -path './vendor/*' | grep -q .; then
            go test -v -race -coverprofile=coverage.txt ./...
          else
            echo "No Go tests found yet."
          fi

      - name: Upload test coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.txt
          flags: unittests
          fail_ci_if_error: false
          verbose: false

      - name: Verify Build
        run: |
          if [ -f "cmd/tuner/main.go" ]; then
            go build -v -o bin/tuner cmd/tuner/main.go
          else
            echo "cmd/tuner/main.go not present yet."
          fi

  documentation-quality:
    name: Documentation Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Lint Markdown files
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: .
          config_file: .markdownlint.json
          ignore_files: node_modules vendor
